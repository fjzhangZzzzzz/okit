version: 2

project_name: okit

builds:
  - id: okit
    main: ./cmd/okit
    binary: okit
    env: [CGO_ENABLED=0]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Tag}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: release
    ids: [okit]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

release:
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1

changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:']
