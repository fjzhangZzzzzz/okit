name: 清理旧 GitHub Pages 发布

on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: 准备空站点
        run: mkdir -p .pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - name: 部署空站点
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
