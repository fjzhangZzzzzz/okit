name: 发布

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  validate-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 验证正式版本对应的 RC
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          sh scripts/verify-release-candidate.sh
          --version "${{ github.ref_name }}"
          --repository "${{ github.repository }}"
          --commit "${{ github.sha }}"

  release:
    needs: validate-release-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: 验证
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
      - name: 生成发布清单
        run: go run ./internal/releasemanifest/cmd/generate --version "${{ github.ref_name }}" --output .release/release-manifest.json
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-release-lifecycle-linux:
    needs: release
    runs-on: ubuntu-latest
    env:
      OKIT_VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Linux 发布生命周期冒烟测试
        env:
          OKIT_HOME: ${{ runner.temp }}/okit-home
          OKIT_INSTALL_DIR: ${{ runner.temp }}/okit-bin
        run: sh scripts/smoke-release-lifecycle.sh --release --version "$OKIT_VERSION" --repository "${{ github.repository }}"

  smoke-release-lifecycle-windows:
    needs: release
    runs-on: windows-latest
    env:
      OKIT_VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Windows 发布生命周期冒烟测试
        shell: pwsh
        env:
          OKIT_HOME: ${{ runner.temp }}\okit-home
          OKIT_INSTALL_DIR: ${{ runner.temp }}\okit-bin
        run: scripts/smoke-release-lifecycle.ps1 -Mode release -Version $env:OKIT_VERSION -Repository "${{ github.repository }}"

  cleanup-release-candidates:
    needs: mark-release-validated
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: 删除正式版本对应的 RC
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINAL_VERSION: ${{ github.ref_name }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | while IFS= read -r tag; do
            case "$tag" in
              "$FINAL_VERSION"-rc.[0-9]*)
                suffix=${tag#"$FINAL_VERSION"-rc.}
                case "$suffix" in
                  ''|*[!0-9]*) continue ;;
                esac
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
                ;;
            esac
          done

  mark-release-validated:
    needs: [smoke-release-lifecycle-linux, smoke-release-lifecycle-windows]
    runs-on: ubuntu-latest
    steps:
      - name: 写入发布验证标记
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          printf '%s\n' \
            '{"version":"'"$RELEASE_VERSION"'","commit":"'"$RELEASE_COMMIT"'","run_id":"'"$RELEASE_RUN_ID"'","linux":true,"windows":true}' \
            > release-validation.json
          gh release upload "$RELEASE_VERSION" release-validation.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
