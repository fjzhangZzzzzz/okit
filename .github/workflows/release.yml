name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
      - name: Generate release manifest
        run: go run ./internal/releasemanifest/cmd/generate --version "${{ github.ref_name }}" --output .release/release-manifest.json
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-release-lifecycle-linux:
    needs: release
    runs-on: ubuntu-latest
    env:
      OKIT_VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Linux release lifecycle smoke test
        env:
          OKIT_HOME: ${{ runner.temp }}/okit-home
          OKIT_INSTALL_DIR: ${{ runner.temp }}/okit-bin
        run: sh scripts/smoke-release-lifecycle.sh --release --version "$OKIT_VERSION" --repository "${{ github.repository }}"

  smoke-release-lifecycle-windows:
    needs: release
    runs-on: windows-latest
    env:
      OKIT_VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Windows release lifecycle smoke test
        shell: pwsh
        env:
          OKIT_HOME: ${{ runner.temp }}\okit-home
          OKIT_INSTALL_DIR: ${{ runner.temp }}\okit-bin
        run: scripts/smoke-release-lifecycle.ps1 -Mode release -Version $env:OKIT_VERSION -Repository "${{ github.repository }}"

  cleanup-release-candidates:
    needs: [smoke-release-lifecycle-linux, smoke-release-lifecycle-windows]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete release candidates for the published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINAL_VERSION: ${{ github.ref_name }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while IFS= read -r tag; do
            case "$tag" in
              "$FINAL_VERSION"-rc.[0-9]*)
                suffix=${tag#"$FINAL_VERSION"-rc.}
                case "$suffix" in
                  ''|*[!0-9]*) continue ;;
                esac
                gh release delete "$tag" --cleanup-tag --yes
                ;;
            esac
          done
