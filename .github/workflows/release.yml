name: 发布

on:
  release:
    types: [published, released]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-channel-pages
  cancel-in-progress: false

jobs:
  publish-prerelease:
    if: >-
      github.event.action == 'published' &&
      github.event.release.prerelease
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: 验证
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
      - name: 生成发布清单
        run: go run ./cmd/release-manifest --version "${{ github.event.release.tag_name }}" --output .release/release-manifest.json
      - name: 构建并上传预发布制品
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.event.release.tag_name }}
      - name: 准备预发布通道
        env:
          CHANNEL_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p .pages/channels/prerelease
          jq -e --arg version "$VERSION" '.version == $version and (.assets | length > 0)' .release/release-manifest.json >/dev/null
          cp .release/release-manifest.json .pages/channels/prerelease/release-manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - name: 发布 GitHub Pages 预发布通道
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

  finalize-stable:
    if: >-
      github.event.action == 'released' &&
      !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 准备正式通道
        env:
          CHANNEL_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p .pages/channels/prerelease
          status=$(curl -sS -o .pages/channels/prerelease/release-manifest.json -w '%{http_code}' "$CHANNEL_BASE/channels/prerelease/release-manifest.json")
          if [ "$status" = 200 ]; then
            test "$(jq -r .version .pages/channels/prerelease/release-manifest.json)" != "$VERSION" || rm .pages/channels/prerelease/release-manifest.json
          else
            test "$status" = 404
            rm -f .pages/channels/prerelease/release-manifest.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - name: 发布 GitHub Pages 正式通道
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
