name: 发布

on:
  release:
    types: [published, released]

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  reject-direct-stable:
    if: >-
      github.event.action == 'published' &&
      !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: 拒绝直接发布正式版本
        run: |
          echo "直接发布正式版本被拒绝：请先创建预发布版本，完成验证后再升格正式版本。" >&2
          exit 1

  publish-prerelease:
    if: >-
      github.event.action == 'published' &&
      github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: 验证
        run: |
          [[ "${{ github.event.release.tag_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
      - name: 生成预发布清单
        run: go run ./cmd/release-manifest --version "${{ github.event.release.tag_name }}" --output .release/release-manifest.json
      - name: 构建并上传预发布制品
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.event.release.tag_name }}
      - name: 校验预发布制品
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          assets=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for required in install.ps1 install.sh release-manifest.json checksums.txt; do
            grep -Fxq "$required" <<< "$assets" || { echo "Release $VERSION 缺少制品：$required" >&2; exit 1; }
          done
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --output .release/remote-manifest.json
          jq -e --arg version "$VERSION" '.version == $version and (.assets | length > 0)' .release/remote-manifest.json >/dev/null

  promote-stable:
    if: >-
      github.event.action == 'released' &&
      !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: 升格正式版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RC_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]] || {
            echo "正式升格事件的 tag 不是 rc 版本：$RC_TAG" >&2
            exit 1
          }
          VERSION="${RC_TAG%-rc.*}"
          RC_COMMIT=$(git rev-list -n 1 "$RC_TAG")
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "正式 tag 已存在：$VERSION" >&2
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "正式 Release 已存在：$VERSION" >&2
            exit 1
          fi
          latest_rc=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | grep -E "^${VERSION}-rc\\.[1-9][0-9]*$" | sort -V | tail -n 1 || true)
          test "$latest_rc" = "$RC_TAG" || { echo "只能升格最新预发布版本：当前=$RC_TAG，最新=$latest_rc" >&2; exit 1; }
          rollback() {
            status=$?
            if [ "$status" -ne 0 ]; then
              gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --tag "$RC_TAG" --title "$RC_TAG" --prerelease=true >/dev/null 2>&1 || \
                gh release edit "$RC_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=true >/dev/null 2>&1 || true
              git push origin ":refs/tags/$VERSION" >/dev/null 2>&1 || true
              echo "正式升格失败，已尝试恢复预发布状态：$RC_TAG" >&2
            fi
            exit "$status"
          }
          trap rollback EXIT
          test "$RC_COMMIT" = "$(git rev-list -n 1 "$RC_TAG")"
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
          git tag "$VERSION" "$RC_COMMIT"
          git push origin "refs/tags/$VERSION"
          gh release edit "$RC_TAG" --repo "$GITHUB_REPOSITORY" --tag "$VERSION" --title "$VERSION"
          go run ./cmd/release-manifest --version "$VERSION" --output .release/release-manifest.json
          printf 'VERSION=%s\nRC_TAG=%s\n' "$VERSION" "$RC_TAG" >> "$GITHUB_ENV"

      - name: 构建正式制品
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}

      - name: 上传并校验正式制品
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          old_assets=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          mkdir -p .release/rollback
          while IFS= read -r asset; do
            [ -n "$asset" ] && gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir .release/rollback
          done <<< "$old_assets"
          while IFS= read -r asset; do
            [ -n "$asset" ] && gh release delete-asset "$VERSION" "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done <<< "$old_assets"
          gh release upload "$VERSION" dist/*.tar.gz dist/*.zip dist/checksums.txt .release/release-manifest.json scripts/install.sh scripts/install.ps1 --repo "$GITHUB_REPOSITORY" --clobber
          assets=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for required in install.ps1 install.sh release-manifest.json checksums.txt; do
            grep -Fxq "$required" <<< "$assets" || { echo "正式 Release $VERSION 缺少制品：$required" >&2; exit 1; }
          done
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --output .release/remote-manifest.json
          jq -e --arg version "$VERSION" '.version == $version and (.assets | length > 0)' .release/remote-manifest.json >/dev/null

      - name: 清理旧 rc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -uo pipefail
          cleanup_failed=0
          for tag in $(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | grep -E "^${VERSION}-rc\\.[1-9][0-9]*$"); do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes || cleanup_failed=1
            git push origin ":refs/tags/$tag" || cleanup_failed=1
          done
          if [ "$cleanup_failed" -ne 0 ]; then
            echo "正式版本已发布，但部分 rc 清理失败；请重新运行清理。" >&2
          fi

      - name: 升格失败时恢复预发布
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_TAG: ${{ github.event.release.tag_name }}
        run: |
          set +e
          VERSION="${RC_TAG%-rc.*}"
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --tag "$RC_TAG" --title "$RC_TAG" --prerelease=true
          if [ -d .release/rollback ]; then
            current_assets=$(gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            while IFS= read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$RC_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done <<< "$current_assets"
            gh release upload "$RC_TAG" .release/rollback/* --repo "$GITHUB_REPOSITORY" --clobber
          fi
          git push origin ":refs/tags/$VERSION"
          echo "正式升格失败，已尝试恢复预发布状态：$RC_TAG" >&2
