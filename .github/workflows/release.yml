name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-linux:
    needs: release
    runs-on: ubuntu-latest
    env:
      OKIT_VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Install and inspect lifecycle plan
        env:
          OKIT_HOME: ${{ runner.temp }}/okit-home
          OKIT_INSTALL_DIR: ${{ runner.temp }}/okit-bin
        run: sh scripts/smoke-release.sh --release --version "$OKIT_VERSION" --repository "${{ github.repository }}"

  smoke-windows:
    needs: release
    runs-on: windows-latest
    env:
      OKIT_VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Install and inspect lifecycle plan
        shell: pwsh
        env:
          OKIT_HOME: ${{ runner.temp }}\okit-home
          OKIT_INSTALL_DIR: ${{ runner.temp }}\okit-bin
        run: scripts/smoke-release.ps1 -Mode release -Version $env:OKIT_VERSION -Repository "${{ github.repository }}"
