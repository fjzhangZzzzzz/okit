name: 发布

on:
  release:
    types: [published, released]

permissions:
  contents: write

jobs:
  publish-prerelease:
    if: >-
      github.event.action == 'published' &&
      github.event.release.prerelease &&
      github.event.release.tag_name != 'pre-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: 验证
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
      - name: 生成发布清单
        run: go run ./cmd/release-manifest --version "${{ github.event.release.tag_name }}" --output .release/release-manifest.json
      - name: 构建并上传预发布制品
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.event.release.tag_name }}
      - name: 更新预发布通道指针
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease
          gh release view pre-release --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create pre-release --repo "$GITHUB_REPOSITORY" --prerelease --title "预发布通道"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir .pointer
          jq -e --arg version "$VERSION" '.version == $version and (.assets | length > 0)' .pointer/release-manifest.json >/dev/null
          gh release upload pre-release .pointer/release-manifest.json --repo "$GITHUB_REPOSITORY" --clobber

  finalize-stable:
    if: >-
      github.event.action == 'released' &&
      github.event.release.tag_name != 'pre-release'
    runs-on: ubuntu-latest
    steps:
      - name: 清理已升格的预发布通道指针
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if gh release download pre-release --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir .pointer 2>/dev/null; then
            test "$(jq -r .version .pointer/release-manifest.json)" = "$VERSION" && gh release delete-asset pre-release release-manifest.json --repo "$GITHUB_REPOSITORY" --yes || true
          fi
