name: Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Linux runtime smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/okit-runtime"
          go build -o "$RUNNER_TEMP/okit-runtime/okit" ./cmd/okit
          sh scripts/smoke-runtime-linux.sh --executable "$RUNNER_TEMP/okit-runtime/okit" --version dev
      - name: Windows runtime smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP 'okit-runtime\okit.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $binary) | Out-Null
          go build -o $binary ./cmd/okit
          scripts/smoke-runtime-windows.ps1 -Executable $binary -Version dev
      - name: Windows Git Bash runtime smoke test
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/smoke-runtime-windows-git-bash.sh --executable "$RUNNER_TEMP/okit-runtime/okit.exe" --version dev
